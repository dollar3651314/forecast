# 端到端测试配置（从复制源复制）。只在 Spring profile e2e 下加载：
#   SPRING_PROFILES_ACTIVE=e2e FC_E2E_ENABLED=true java -jar forecast.jar
# e2e profile 会打开不需要登录的 /api/e2e/**（取验证码、注入充值、推进提现），
# 只能用于 CI 和本机。common.e2e.E2eGuard 在启动时检查：没有 FC_E2E_ENABLED=true、带了 prod/production/staging profile、
# 配置了热钱包私钥、链节点或 SMTP 时拒绝启动。
forecast:
  e2e:
    enabled: ${FC_E2E_ENABLED:false}
  # 通用限流（P-05）：端到端测试和压测（e2e/load/，同样用 e2e profile）的所有请求都来自同一个 IP，压测几十个客户集中写入，上限放大。
  # 限流本身在后端 RateLimitTest 里单独测；Nginx 那一层见 deploy/nginx/site.conf.template
  rate-limit:
    ip-per-minute: 1000000
    ws-handshake-per-minute: 1000000
    user-write-per-minute: 1000000
    admin-login-per-ip: 1000000
  # 发验证码按 IP 限次（SEC-03，默认每小时 30 次）：端到端的注册都来自 127.0.0.1，用例多了以后一次全量就超过 30 次
  # （S17B 加了人工调账的用例后，排在最后的用例注册时收到 429 CODE_TOO_FREQUENT）。限次本身在后端 SendCodeLimiterTest 里单独测
  auth:
    code-ip-hourly-limit: 1000000
  # 钱包：TRON 的 xpub 来自 BIP39 公开的测试助记词（"abandon … about"，人人都知道，没有任何价值）；
  # USDT 合约地址是三条链官方 USDT 合约的公开地址。不配置节点地址：扫块和广播由 e2e 的链替身代替，不连任何真实节点。
  # ERC20、BEP20 的充值地址只用 CREATE2 合约地址（开发记录/钱包-合约地址方案.md）：下面四个地址就是 contracts/script/anvil-e2e.sh
  # 在 anvil 本地链上用 Deploy.s.sol 部署出的地址（anvil 0 号公开测试账户 nonce 0、1、2 依次部署实现合约、工厂、批量合约；parent 是 anvil 1 号账户），
  # 后端照常按 CREATE2 公式算出每个客户的地址，链替身只记转账。不配发起账户（私钥在 e2e 里不允许，E2eGuard），所以 sweep.config 告警是 DOWN，不影响用例
  wallet:
    sweep:
      evm:
        implementation: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
        factory: "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512"
        batcher: "0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0"
        parent: "0x70997970C51812dc3A010C7d01b50e0d17dc79C8"
    tron-xpub: xpub6D1AabNHCupeiLM65ZR9UStMhJ1vCpyV4XbZdyhMZBiJXALQtmn9p42VTQckoHVn8WNqS7dqnJokZHAHcHGoaQgmv8D45oNUKx6DZMNZBCd
    chains:
      ERC20:
        usdt-contract: "0xdAC17F958D2ee523a2206206994597C13D831ec7"
      BSC:
        usdt-contract: "0x55d398326f99059fF775485246999027B3197955"
      TRC20:
        usdt-contract: TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t
  # 风控扫描（S10）：端到端用 /api/e2e/riskalert/scan 立即扫；写入的行马上就能处理
  riskalert:
    scan-lag: 0s
  # 证件照片放在临时目录
  storage:
    local-dir: ${FC_STORAGE_DIR:${java.io.tmpdir}/forecast-e2e-storage}
  # 自动裁决（forecast S6）：币安、OKX 的地址指向后端自己的替身 /api/e2e/candles/**（resolve/web/E2eCandles），端到端走真实的适配器、网关和裁决器，
  # 不连外网；第三源关闭。部署形态里后端在容器里访问自己的 8080 端口
  resolve:
    sources:
      binance:
        base-url: http://127.0.0.1:${server.port:8080}/api/e2e/candles/binance
      okx:
        base-url: http://127.0.0.1:${server.port:8080}/api/e2e/candles/okx
      coinbase:
        enabled: false
      # 体育（forecast S8）：football-data、balldontlie、TheSportsDB 的地址指向后端自己的替身 /api/e2e/sports/**（resolve/web/E2eSports），
      # 端到端走真实的适配器、网关、赛程同步、候选、生成草稿和体育裁决器，不连外网。key 是端到端的测试值（替身只检查有没有带）；不限频，避免重跑时排队
      football-data:
        base-url: http://127.0.0.1:${server.port:8080}/api/e2e/sports/football-data
        key: e2e
        rate-limit: 0
      balldontlie:
        base-url: http://127.0.0.1:${server.port:8080}/api/e2e/sports/balldontlie
        key: e2e
        rate-limit: 0
      thesportsdb:
        base-url: http://127.0.0.1:${server.port:8080}/api/e2e/sports/thesportsdb
        key: e2e
        rate-limit: 0
  # 体育：赛程同步、自动裁决都由用例触发（后台"立即同步"、/api/e2e/sports/tick），不定时跑
  sports:
    sync-enabled: false
    resolver-enabled: false
  # 事件和文章自动化程序（forecast S15）：Gemini 的地址指向后端自己的替身 /api/e2e/gemini/**（content/web/E2eContent），端到端走真实的客户端、
  # 起草、检查和发布流程，不连真实的 Gemini；key 是测试值（ci_only_ 开头），"没有 key"由用例经 /api/e2e/gemini/mode 切换。
  # 定时任务不跑（每日草稿包会和用例抢数据），用例用 /api/e2e/content/tick、/pack 触发；读取超时调短（替身的慢回复用例）
  content:
    jobs-enabled: false
    gemini:
      api-key: ci_only_e2e_gemini
      base-url: http://127.0.0.1:${server.port:8080}/api/e2e/gemini
      read-timeout: 5s
      backoff: 200ms
      max-backoff: 400ms
  # 推广功能（forecast S16）：数据页的币安行情指向后端自己的替身 /api/e2e/board/**（growth/board/E2eBoard），用例设 K 线后调 /api/e2e/board/refresh，
  # 不定时刷新；Telegram 的 Bot API 指向后端自己的替身 /api/e2e/telegram/**（growth/telegram/E2eTelegram），token 是端到端的假值（ci_only_ 开头），
  # 不连真实的 Telegram；取消息、发帖由用例调 /api/e2e/telegram/tick 触发（不跑后台线程），健康检查照常有 telegram.bot；
  # "没有 token"用 /api/e2e/telegram/configured 模拟。频率限制调成 0（用例里连着发）
  growth:
    board:
      refresh-enabled: false
      binance-url: http://127.0.0.1:${server.port:8080}/api/e2e/board/binance
      breaker-open: 1s
  telegram:
    token: ci_only_e2e_telegram
    api-url: http://127.0.0.1:${server.port:8080}/api/e2e/telegram
    jobs-enabled: false
    retries: 1
    chat-interval: 0s
    send-interval: 0s
