# Nginx 主配置（S20）。站点配置在 site.conf.template（启动时用 .env 里的域名替换后放进 conf.d/）。
user nginx;
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  types {
    application/manifest+json webmanifest;
  }
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 8m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
  # 最后一列是追踪号（$request_id，传给后端的 X-Request-Id，v2 E9）：按它在后端日志里查同一个请求
  log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent $request_time "$http_user_agent" $request_id';
  access_log /var/log/nginx/access.log main;

  # WebSocket：有 Upgrade 头时转成 upgrade 连接
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' '';
  }

  # Docker 内置 DNS；后端容器重启后地址会变，用变量让 Nginx 每次重新解析（后端没起来时 Nginx 也能启动）
  resolver 127.0.0.11 valid=10s ipv6=off;

  include /etc/nginx/conf.d/*.conf;
}
