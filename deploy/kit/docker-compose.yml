# 测试环境的容器（部署方案 `部署方案/v1-测试环境与切换.md`）。放在服务器 /opt/forecast/，由 deploy.sh 用两个变量文件启动：
#   .env               ← 密钥和域名，只由 Amos 填（变量名见 env.example），权限 600
#   state/image.env    ← 当前版本 IMAGE_TAG=<提交号>（deploy.sh、rollback.sh 写）
# 内存（C75，部署方案第 3 节"内存总账"）：测试环境和另一个项目轮流用同一台 2 核 2G 服务器（AQ-23，`free -m` 总量 1,613 MB），
# 同一时间只运行一个项目。四个容器上限合计 992 MB（web 32 + app 576 + mysql 320 + redis 64），加系统和 Docker 约 450 MB，余量约 170 MB。
# 每个容器 memswap_limit 等于 mem_limit：到上限就被杀掉、自动重启，不用交换分区拖垮整台机器。
# 数据库、Redis、后端端口都不对公网开放。部署形态的端到端测试（e2e/run-deployed.sh）也用这份文件，所以 CI 每次都在这些上限下跑主流程。
name: forecast

x-logging: &logging
  driver: json-file
  options:
    max-size: 50m
    max-file: "3"

services:
  web:
    image: ghcr.io/dollar3651314/forecast-web:${IMAGE_TAG:?缺少 IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?缺少 APP_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?缺少 ADMIN_DOMAIN}
      # 官网（v2，部署方案第 14 节）。已有服务器的 .env 还没加时用一个不会被访问到的占位域名，Nginx 照常启动，官网那一段不生效
      WWW_DOMAIN: ${WWW_DOMAIN:-www-not-configured.invalid}
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - app
    # Nginx 实测十几 MB 以内（复制源测试服务器 `docker stats`）
    mem_limit: 32m
    memswap_limit: 32m
    logging: *logging

  app:
    image: ghcr.io/dollar3651314/forecast-app:${IMAGE_TAG:?缺少 IMAGE_TAG}
    restart: unless-stopped
    # 只给本机的部署脚本做健康检查，不对公网开放（云防火墙也只开 80、443）
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      FC_DB_URL: jdbc:mysql://mysql:3306/forecast?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
      FC_DB_USERNAME: forecast
      FC_DB_PASSWORD: ${FC_DB_PASSWORD:?缺少 FC_DB_PASSWORD}
      FC_REDIS_HOST: redis
      FC_REDIS_PASSWORD: ${FC_REDIS_PASSWORD:?缺少 FC_REDIS_PASSWORD}
      FC_COOKIE_SECURE: "true"
      FC_ENV_LABEL: test
      # JVM 各部分上限（C75，覆盖镜像里的默认值；镜像默认值按 768 MB 容器设，见 deploy/app.Dockerfile）：
      #   堆 256 + 元空间 128 + 代码缓存 48 + 直接内存 32 + 线程栈 512K × 约 110 个线程（Tomcat 最多 60 个 + 连接池、定时任务、推送等）≈ 55
      #   = 519 MB，加 GC、JIT 编译、类库等其他本地内存约 50 MB，合计约 570 MB ≤ mem_limit 576 MB
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=48m -XX:MaxDirectMemorySize=32m -Xss512k -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError"
      # 线程数和数据库连接数也有上限，线程栈和 MySQL 的连接内存才算得清（测试环境的访问量远用不到）
      SERVER_TOMCAT_THREADS_MAX: "60"
      FC_DB_POOL_SIZE: "15"
      FC_ADMIN_INIT_USERNAME: ${FC_ADMIN_INIT_USERNAME:-}
      FC_ADMIN_INIT_PASSWORD: ${FC_ADMIN_INIT_PASSWORD:-}
      FC_MAIL_HOST: ${FC_MAIL_HOST:-}
      FC_MAIL_PORT: ${FC_MAIL_PORT:-587}
      FC_MAIL_SECURITY: ${FC_MAIL_SECURITY:-STARTTLS}
      FC_MAIL_USERNAME: ${FC_MAIL_USERNAME:-}
      FC_MAIL_PASSWORD: ${FC_MAIL_PASSWORD:-}
      FC_MAIL_FROM: ${FC_MAIL_FROM:-}
      FC_PUSH_VAPID_PUBLIC_KEY: ${FC_PUSH_VAPID_PUBLIC_KEY:-}
      FC_PUSH_VAPID_PRIVATE_KEY: ${FC_PUSH_VAPID_PRIVATE_KEY:-}
      FC_PUSH_VAPID_SUBJECT: ${FC_PUSH_VAPID_SUBJECT:-}
      FC_RISK_ALERT_EMAILS: ${FC_RISK_ALERT_EMAILS:-}
      # 监控告警收件人：没有默认值，必须由 Amos 在 .env 里填（架构方案第 1.4 节 ⑤）
      FC_ALERT_EMAILS: ${FC_ALERT_EMAILS:-}
      # 雪花 ID 节点号（单实例 1）
      FC_ID_NODE: ${FC_ID_NODE:-1}
      # 结算派彩每批的持仓数（forecast S5）：500（默认）= 先算好再分批派彩（AQ-3 已定：B）；0 = 计算和派彩同一个事务
      FC_SETTLE_BATCH_SIZE: ${FC_SETTLE_BATCH_SIZE:-500}
      # 加密自动裁决的第三源 Coinbase（forecast S6，AQ-13）：默认关闭；true = 主备一方拿不到时用它补位
      FC_SOURCE_COINBASE_ENABLED: ${FC_SOURCE_COINBASE_ENABLED:-false}
      # 体育数据源的 key（forecast S8，AQ-17）：Amos 注册后填进 .env；没填的来源"未开通"（健康检查 alerts 里显示，用到它的体育市场转人工）
      FC_SRC_FOOTBALL_DATA_TOKEN: ${FC_SRC_FOOTBALL_DATA_TOKEN:-}
      FC_SRC_BALLDONTLIE_KEY: ${FC_SRC_BALLDONTLIE_KEY:-}
      FC_SRC_THESPORTSDB_KEY: ${FC_SRC_THESPORTSDB_KEY:-}
      # 区块链（D4 第二步才填，全部用测试网）；没配置的链不扫块
      FC_WALLET_TRON_XPUB: ${FC_WALLET_TRON_XPUB:-}
      FC_WALLET_ETH_RPC_URL: ${FC_WALLET_ETH_RPC_URL:-}
      FC_WALLET_BSC_RPC_URL: ${FC_WALLET_BSC_RPC_URL:-}
      FC_WALLET_TRON_RPC_URL: ${FC_WALLET_TRON_RPC_URL:-}
      FC_WALLET_ERC20_USDT_CONTRACT: ${FC_WALLET_ERC20_USDT_CONTRACT:-}
      FC_WALLET_BSC_USDT_CONTRACT: ${FC_WALLET_BSC_USDT_CONTRACT:-}
      FC_WALLET_TRC20_USDT_CONTRACT: ${FC_WALLET_TRC20_USDT_CONTRACT:-}
      FC_WALLET_ERC20_CHAIN_ID: ${FC_WALLET_ERC20_CHAIN_ID:-11155111}
      FC_WALLET_BSC_CHAIN_ID: ${FC_WALLET_BSC_CHAIN_ID:-97}
      FC_WALLET_ETH_HOT_KEY: ${FC_WALLET_ETH_HOT_KEY:-}
      FC_WALLET_TRON_HOT_KEY: ${FC_WALLET_TRON_HOT_KEY:-}
      FC_WALLET_ETH_HOT_ADDRESS: ${FC_WALLET_ETH_HOT_ADDRESS:-}
      FC_WALLET_TRON_HOT_ADDRESS: ${FC_WALLET_TRON_HOT_ADDRESS:-}
      # ERC20、BEP20 充值地址和资金归集：合约地址都是公开地址，发起账户私钥只由 Amos 填；四个合约地址没填齐时 ERC20、BEP20 暂未开通（不退回 xpub）
      FC_SWEEP_EVM_FACTORY: ${FC_SWEEP_EVM_FACTORY:-}
      FC_SWEEP_EVM_IMPLEMENTATION: ${FC_SWEEP_EVM_IMPLEMENTATION:-}
      FC_SWEEP_EVM_PARENT: ${FC_SWEEP_EVM_PARENT:-}
      FC_SWEEP_EVM_BATCHER: ${FC_SWEEP_EVM_BATCHER:-}
      FC_SWEEP_EVM_OPERATOR_ADDRESS: ${FC_SWEEP_EVM_OPERATOR_ADDRESS:-}
      FC_SWEEP_EVM_OPERATOR_KEY: ${FC_SWEEP_EVM_OPERATOR_KEY:-}
    volumes:
      - ./data/storage:/data/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 单实例：停机时先处理完队列再退出
    stop_grace_period: 60s
    # 不给容器用交换分区（memswap = mem）：到上限就被杀掉重启，不能拖着整台机器换页卡死（部署方案第 19 节）
    mem_limit: 576m
    memswap_limit: 576m
    logging: *logging

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?缺少 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: forecast
      MYSQL_USER: forecast
      MYSQL_PASSWORD: ${FC_DB_PASSWORD:?缺少 FC_DB_PASSWORD}
      TZ: UTC
    # 2G 内存、和另一个项目轮流用（部署方案第 3 节）：缓冲池 128M、关闭性能监控、连接数 30（后端连接池 15 + 备份 + 余量）。
    # 合计：缓冲池 128 + 日志缓冲 8 + 键缓冲 8 + 其他全局约 100 + 连接 30 × 约 2 MB = 60，约 300 MB ≤ mem_limit 320 MB
    command:
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
      - --max-connections=30
      - --innodb-log-buffer-size=8M
      - --key-buffer-size=8M
      - --tmp-table-size=16M
      - --max-heap-table-size=16M
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 320m
    memswap_limit: 320m
    logging: *logging

  redis:
    image: redis:7
    restart: unless-stopped
    # 密码从容器的环境变量读，不写进 compose 的命令行
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --maxmemory 32mb --maxmemory-policy noeviction --save 300 10"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${FC_REDIS_PASSWORD:?缺少 FC_REDIS_PASSWORD}
    # maxmemory 32 MB + 进程约 10 MB；数据只有限流计数和推送广播，实测十几 MB
    mem_limit: 64m
    memswap_limit: 64m
    logging: *logging
