<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <!-- 官网地址（服务条款、隐私、风险披露的链接，S11）：部署时 Nginx 换成 https://官网域名，端到端测试站点换成本机官网（src/lib/siteUrl.ts） -->
    <meta name="fc-site-url" content="__FC_SITE_URL__" />
    <script>
      // 主题跟随系统（RQ-1）；选过的（fc.theme）优先。和 src/app/ThemeProvider.tsx 同一个规则，渲染前先设好，避免闪一下另一种颜色
      (function () {
        var t = null;
        try { t = localStorage.getItem('fc.theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Quick Come" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Quick Come</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
